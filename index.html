<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF2F3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="So Temi Shoot">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>So Temi Launch Shoot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: a call-sheet app. Sticky header + tabs, then one working view at a time (Live, Shots, Models, Schedule, Props). */
:root{
  --bg:#FBF2F3; --surface:#FFFFFF; --sunk:#F5E6E9; --line:#ECD3D9; --ink:#2C1820; --muted:#7F6570;
  --accent:#C8557D; --accent-ink:#FFFFFF; --butter:#F3E2A0; --good:#5E8B62; --warn:#B9652A;
  --p-pilates:#DCE8D2; --p-ballerina:#F7D3DE; --p-homebody:#F6E7B4; --p-errands:#F8D9C4; --p-travel:#D3E4F2; --p-bookworm:#E3D8F1; --p-artsy:#D6EEE6;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1216; --surface:#27191F; --sunk:#311F27; --line:#4A2F3A; --ink:#F7E9EE; --muted:#BFA3AE;
  --accent:#F08DB0; --accent-ink:#2A1018; --butter:#5B4E22; --good:#8FC193; --warn:#E9A16A;
  --p-pilates:#34442E; --p-ballerina:#55303E; --p-homebody:#4D4322; --p-errands:#54392A; --p-travel:#283E52; --p-bookworm:#3D3152; --p-artsy:#24443B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1216; --surface:#27191F; --sunk:#311F27; --line:#4A2F3A; --ink:#F7E9EE; --muted:#BFA3AE;
  --accent:#F08DB0; --accent-ink:#2A1018; --butter:#5B4E22; --good:#8FC193; --warn:#E9A16A;
  --p-pilates:#34442E; --p-ballerina:#55303E; --p-homebody:#4D4322; --p-errands:#54392A; --p-travel:#283E52; --p-bookworm:#3D3152; --p-artsy:#24443B;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
header.top{background:var(--bg)}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand h1{font-size:clamp(26px,5vw,38px);line-height:1.05;font-style:italic}
.brand .meta{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--muted)}
.modeswitch{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.modeswitch button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.modeswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(60,20,35,.12)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px 11px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.progress{height:3px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

main{padding-top:18px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
.section-h h2{font-size:24px}
.lede{max-width:64ch;color:var(--muted);margin:4px 0 0}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;line-height:1.1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.p-tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600;border:1px solid transparent;line-height:1.1}
.p-tag.off{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}
button.p-tag{cursor:pointer}
.pc-pilates{background:var(--p-pilates)}.pc-ballerina{background:var(--p-ballerina)}.pc-homebody{background:var(--p-homebody)}
.pc-errands{background:var(--p-errands)}.pc-travel{background:var(--p-travel)}.pc-bookworm{background:var(--p-bookworm)}

/* shot cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.shot.done{border-color:var(--good)}
.shot .ph{position:relative;aspect-ratio:4/5;background:var(--sunk);max-width:100%}
.shot .ph:has(.noimg){aspect-ratio:16/7}
.shot .ph img{width:100%;height:100%;object-fit:cover;display:block}
.shot .ph .noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-family:var(--display);font-style:italic;font-size:18px}
.code{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:#2C1820;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;letter-spacing:.08em}
.prio{position:absolute;right:10px;top:10px;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;letter-spacing:.06em;border:0}
.prio.must{background:var(--accent);color:var(--accent-ink)}
.prio.bonus{background:rgba(255,255,255,.92);color:#7F6570}
.donebadge{position:absolute;inset:auto 10px 10px auto;background:var(--good);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.shot .body{padding:12px 13px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
.shot h3{font-size:18px;line-height:1.2}
.shot p{margin:0;font-size:13.5px;color:var(--muted)}
.props{font-size:13px}
.props b{font-weight:600}
.cam{font-size:12px;font-weight:600;color:var(--muted)}
.tick{margin-top:auto;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.who{display:flex;gap:5px;flex-wrap:wrap}

/* models */
.personas{display:flex;gap:6px;flex-wrap:wrap}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:22px}
@media (max-width:760px){.mcard{grid-template-columns:1fr}}
.mcard h2{font-size:34px;font-style:italic;line-height:1.05}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.kv select,.field{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;max-width:100%}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mini figure{margin:0;background:var(--sunk);border-radius:10px;overflow:hidden;position:relative}
.mini img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.mini figcaption{padding:6px 8px;font-size:12px;font-weight:600;line-height:1.25}
.mini .code{font-size:10px;left:6px;top:6px}
.mini figure.done::after{content:"✓";position:absolute;right:6px;top:6px;background:var(--good);color:#fff;border-radius:999px;width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700}
.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.box{background:var(--sunk);border-radius:12px;padding:12px 14px}
.est{font-size:13px;margin-top:6px}
.est.over{color:var(--warn);font-weight:600}

/* schedule */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
tr.now td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
tr.blockdone td{opacity:.55}
table.sched{min-width:0}table.sched td,table.sched th{padding-left:10px;padding-right:10px}table.sched td:first-child{width:62px}table.sched tr.blk td{border-top:3px solid var(--accent)}
td select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 6px;max-width:100%}
.callsheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.callsheet label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.callsheet input,.callsheet textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--ink);font-weight:500}
.tbc{color:var(--warn);font-weight:600}

/* props */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pbox h3{font-size:19px;margin-bottom:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--good);flex:none}
.check .src{color:var(--muted);font-size:12px}

/* live */
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.big{font-family:var(--display);font-size:clamp(34px,7vw,54px);line-height:1;font-style:italic}
.stations{display:grid;gap:8px;margin-top:12px}
.st{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent);padding-top:8px;font-size:14px}
.st b{font-weight:600}
.alert{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.alert.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.alert.bad{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.sync{font-size:12px;color:var(--muted)}
.cardtools{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.linkbtn{border:0;background:none;padding:4px 0;font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.linkbtn.quiet{color:var(--muted)}
.editf{display:flex;flex-direction:column;gap:8px}
.editf label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.editf input,.editf textarea,.editf select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink);font-weight:500;width:100%}
.addpanel{background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:16px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
@media (max-width:600px){.addpanel{grid-template-columns:1fr}}
.drop{aspect-ratio:4/5;border-radius:10px;background:var(--sunk);display:grid;place-items:center;text-align:center;overflow:hidden;position:relative;color:var(--muted);font-size:13px;padding:10px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.shot.removed{opacity:.6}
.addedtag{position:absolute;left:10px;bottom:10px;background:var(--butter);color:var(--ink);border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
body{overflow-x:clip}
input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
#glamPop{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;display:grid;gap:8px;max-width:560px;margin:0 auto}
#glamPop:empty{display:none}
#glamPop .alert{margin:0!important;box-shadow:0 10px 30px rgba(40,10,20,.3);background:var(--surface);border:2px solid var(--warn);color:var(--ink)}
.pc-bookworm2{background:var(--p-artsy)}
.prio-h{font-size:20px;margin:18px 0 10px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.step .st-time{font-weight:700;font-size:14px}
.step .st-cam{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.step .st-title{font-weight:600;margin-top:2px}
.step.k-brief,.step.k-swap,.step.k-buffer,.step.k-move,.step.k-wrap{background:var(--sunk);border-style:dashed}
.step.k-group,.step.k-groupvideo{border-left:4px solid var(--accent)}
.step.now{outline:2px solid var(--accent)}
.codelink{border:0;background:none;padding:0 1px;font:inherit;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.peek{position:fixed;inset:0;z-index:50;background:rgba(30,12,20,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.peekcard{position:relative;background:var(--surface);border-radius:var(--r);max-width:440px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.peekcard img{display:block;width:100%;max-height:58vh;object-fit:contain;background:var(--sunk)}
.peekbody{padding:14px 16px 18px}.peekbody h3{font-size:22px;margin:4px 0 6px}.peekbody p{margin:0 0 8px}
.peekx{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.login{max-width:440px;margin:48px auto}
.login h2{font-size:34px;margin:6px 0 10px}
.login .alert{margin:12px 0}
body[data-role="none"] .modeswitch, body[data-role="none"] .navbar, body[data-role="none"] .top, 
body[data-role="model"] .modeswitch, body[data-role="model"] .navbar{display:none}
body[data-role="coord"] [data-mode="plan"]::after{content:" (view)";font-weight:500}
</style>
</head>
<body data-role="none">

<header class="top">
  <div class="wrap" style="padding-block:0">
    <div class="hdr">
      <div class="brand">
        <div class="eyebrow">So Temi · lounge wear launch</div>
        <h1>The Launch Shoot</h1>
        <div class="meta tnum" id="hdrMeta"></div>
      </div>
      <div class="modeswitch" role="group" aria-label="Mode">
        <button id="modePlan" data-mode="plan">Planning</button>
        <button id="modeDay" data-mode="day">Shoot day</button>
      </div>
    </div>
  </div>
</header>
<div class="navbar">
  <div class="wrap" style="padding-block:0">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="live" id="tab-live">Live</button>
      <button role="tab" data-tab="glam" id="tab-glam">Getting ready</button>
      <button role="tab" data-tab="shots" id="tab-shots">Shots</button>
      <button role="tab" data-tab="moods" id="tab-moods">Moodboards</button>
      <button role="tab" data-tab="models" id="tab-models">Models</button>
      <button role="tab" data-tab="schedule" id="tab-schedule">Schedule</button>
      <button role="tab" data-tab="rooms" id="tab-rooms">Rooms</button>
      <button role="tab" data-tab="props" id="tab-props">Props</button>
      <button role="tab" data-tab="campus" id="tab-campus">Campus Girl</button>
    </nav>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog" style="width:0"></i></div>
</div>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>


<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
